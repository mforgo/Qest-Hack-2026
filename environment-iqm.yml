# IQM environment (works on Windows, Linux, macOS).
# Create with:  conda env create -f environment-iqm.yml
# Update with:  conda env update -f environment-iqm.yml --prune
#
# Kept in sync with requirements-iqm.txt (pip-only / venv alternative).
# Must stay separate from environment-ibm.yml: iqm-client pins qiskit<2.2 and
# pydantic<2.13, which conflicts with qiskit-ibm-runtime (qiskit>=2.3, pydantic>=2.13).
name: qest-iqm
channels:
  - conda-forge
dependencies:
  - python=3.13
  - pip
  - pip:
      - "iqm-client[qiskit]>=37.0,<38"
      - "iqm-qaoa>=3.1,<4"
      - "numpy>=2.2,<3"
      - "scipy>=1.13"
      - "matplotlib>=3.8"
      - "python-dotenv>=1.0"
