# IBM Quantum environment (works on Windows, Linux, macOS).
# Create with:  conda env create -f environment-ibm.yml
# Update with:  conda env update -f environment-ibm.yml --prune
#
# Kept in sync with requirements-ibm.txt (pip-only / venv alternative).
name: qest-ibm
channels:
  - conda-forge
dependencies:
  - python=3.13
  - pip
  - pip:
      - "qiskit[visualization]>=2.6,<3"
      - "qiskit-aer>=0.18,<0.19"
      - "qiskit-ibm-runtime>=0.52,<0.53"
      - "qiskit-addon-opt-mapper>=0.1,<0.2"
      - "numpy>=2.0,<3"
      - "scipy>=1.13"
      - "matplotlib>=3.8"
      - "python-dotenv>=1.0"
